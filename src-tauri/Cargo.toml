[package]
name = "plasma-hub"
version = "0.1.0"
description = "Plasma Hub desktop and Android app"
authors = ["Camacho"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plasma_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.7.0", features = [] }

[dependencies]
tauri = { version = "^2.12.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"

plasma-core = { path = "../crates/plasma-core" }
plasma-download = { path = "../crates/plasma-download" }
plasma-duplicates = { path = "../crates/plasma-duplicates" }
plasma-media = { path = "../crates/plasma-media" }
plasma-platform = { path = "../crates/plasma-platform" }
plasma-store = { path = "../crates/plasma-store" }
plasma-telegram = { path = "../crates/plasma-telegram" }
plasma-tiktok = { path = "../crates/plasma-tiktok" }
plasma-twitter = { path = "../crates/plasma-twitter" }
plasma-youtube = { path = "../crates/plasma-youtube" }

# TDLib linkage is provided by build.rs for the final application binary.
tdlib-rs = { version = "1.4.0", features = ["download-tdlib"] }

[target.'cfg(not(target_os = "android"))'.build-dependencies]
tdlib-rs = { version = "1.4.0", features = ["download-tdlib"] }
