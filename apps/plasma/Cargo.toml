[package]
name = "plasma"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Plasma Hub Rust application shell (Dioxus)"

[dependencies]
plasma-core = { path = "../../crates/plasma-core" }
plasma-platform = { path = "../../crates/plasma-platform" }
plasma-store = { path = "../../crates/plasma-store" }
plasma-telegram = { path = "../../crates/plasma-telegram" }
plasma-ui = { path = "../../crates/plasma-ui" }
dirs = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
dioxus = { workspace = true, features = ["desktop", "launch", "logger"] }

[target.'cfg(target_os = "android")'.dependencies]
dioxus = { workspace = true, features = ["mobile", "launch", "logger"] }

[lints]
workspace = true
