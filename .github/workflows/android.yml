name: Android build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/shared/platform/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-android-toolchain.sh'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - run: npm ci
      - name: Verify Android toolchain
        run: scripts/check-android-toolchain.sh
      - name: Generate and build the arm64 debug APK
        run: |
          npm run tauri:android:init -- --ci --skip-targets-install
          npx tauri android build --debug --apk --target aarch64 --ci
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: plasma-hub-arm64-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
