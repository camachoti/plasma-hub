name: Android build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check-android-toolchain.sh'
      - 'scripts/build-dioxus-android.sh'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Verify Android toolchain
        run: scripts/check-android-toolchain.sh
      - name: Generate and build the arm64 debug APK
        run: scripts/build-dioxus-android.sh debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: plasma-hub-arm64-debug-apk
          path: |
            target/dx/plasma/debug/android/app/app/build/outputs/apk/debug/*.apk
            apps/plasma/target/dx/plasma/debug/android/app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
