name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace / Dioxus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev libxdo-dev libc++1 libc++abi1 libunwind-18
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace

  android:
    name: Android aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Verify Android toolchain
        run: scripts/check-android-toolchain.sh
      - name: Build the arm64 debug APK
        run: scripts/build-dioxus-android.sh debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: plasma-hub-arm64-debug-apk
          path: |
            target/dx/plasma/debug/android/app/app/build/outputs/apk/debug/*.apk
            apps/plasma/target/dx/plasma/debug/android/app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
